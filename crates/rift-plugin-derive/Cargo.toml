[package]
name = "rift-plugin-derive"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[features]
# Enables the `#[modifiers]` attribute macro. Off by default so consumers that
# only need the `Params` / `DeriveEnumValues` derives are unaffected.
default = []
modifiers = []

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
darling = "0.23.0"