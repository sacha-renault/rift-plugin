[workspace]
resolver = "2"
members = ["crates/*", "examples/*", "xtask" ]

[workspace.dependencies]
rift-plugin = { path = "crates/rift-plugin" }
rift-fun-dsp  = { path = "crates/rift-fun-dsp" }
rift-plugin-derive  = { path = "crates/rift-plugin-derive" }
rift-plugin-resolver = { path = "crates/rift-plugin-resolver" }
rift-plugin-accumulator = { path = "crates/rift-plugin-accumulator" }
rift-plugin-utils = { path = "crates/rift-plugin-utils" }
rift-plugin-gui = { path = "crates/rift-plugin-gui" }
rift-plugin-params = { path = "crates/rift-plugin-params" }
rift-plugin-types = { path = "crates/rift-plugin-types" }
rift-plugin-buffers = { path = "crates/rift-plugin-buffers" }
rift-plugin-context = { path = "crates/rift-plugin-context" }
rift-plugin-wrapper = { path = "crates/rift-plugin-wrapper" }
rift-plugin-vizia = { path = "crates/rift-plugin-vizia" }
rift-plugin-dsp = { path = "crates/rift-plugin-dsp" }

clack-plugin = { git = "https://github.com/prokopyl/clack" }
clack-extensions = { git = "https://github.com/prokopyl/clack", features = [
  "audio-ports",
  "clack-plugin",
  "gui",
  "note-ports",
  "params",
  "raw-window-handle_06",
  "state",
  "latency",
  "context-menu",
] }

raw-window-handle = "0.6"
crossbeam-queue = "0.3.12"
parking_lot = "0.12.5"
arc-swap = "1"
rustfft = "6.4.1"
log = "0.4"
bon = "3.8.2"
serde_json = { version = "1" }
fundsp = { version = "0.23.0" }

# baseview 0.2.2 registers its macOS frame timer in kCFRunLoopDefaultMode, which
# starves when a host runs the run loop in another mode (e.g. event tracking).
# This fork switches it to kCFRunLoopCommonModes so on_frame ticks every frame.
[patch.crates-io]
baseview = { git = "https://github.com/sacha-renault/baseview", rev = "239f944aa089bc15e241b92212530768e5b219bf" }
